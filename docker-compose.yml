services:
  app:
    build: .
    hostname: app
    container_name: firefly_iii_core
    restart: always
    volumes:
      - .:/var/www/html
      - firefly_iii_vendor:/var/www/html/vendor
      - firefly_iii_public_build:/var/www/html/public/build
      - firefly_iii_public_v1:/var/www/html/public/v1/js
      - ./public/v1/js/ff/rules:/var/www/html/public/v1/js/ff/rules
      - firefly_iii_upload:/var/www/html/storage/upload
      - ./storage/backups:/var/www/html/storage/backups
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_CONNECTION=pgsql
    networks:
      - firefly_iii
    ports:
      - 80:8080
    depends_on:
      - db
  db:
    image: postgres:17
    hostname: db
    container_name: firefly_iii_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    networks:
      - firefly_iii
    ports:
      - 5432:5432
    volumes:
      - firefly_iii_db:/var/lib/postgresql/data
  cron:
    #
    # To make this work, set STATIC_CRON_TOKEN in your .env file or as an environment variable
    # The STATIC_CRON_TOKEN must be *exactly* 32 characters long
    #
    image: alpine
    restart: always
    container_name: firefly_iii_cron
    env_file: .env
    command: sh -c "
      apk add tzdata && \
      (ln -s /usr/share/zoneinfo/$$TZ /etc/localtime || true) && \
      echo \"0 3 * * * wget -qO- http://app:8080/api/v1/cron/$$STATIC_CRON_TOKEN;echo\"
      | crontab - && \
      crond -f -L /dev/stdout"
    networks:
      - firefly_iii
    depends_on:
      - app

  #
  # Ollama -- local LLM for the Budget Planner.
  # Models are persisted in a volume so they only download once.
  # Set BUDGET_LLM_MODEL in .env to choose which model to auto-pull (default: llama3.1).
  # The app connects via http://ollama:11434 on the internal Docker network.
  #
  ollama:
    image: ollama/ollama:latest
    hostname: ollama
    container_name: firefly_iii_ollama
    restart: always
    volumes:
      - firefly_iii_ollama:/root/.ollama
    networks:
      - firefly_iii
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: firefly_iii_ollama_pull
    restart: "no"
    entrypoint: ["sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull ${BUDGET_LLM_MODEL:-llama3.1}"]
    networks:
      - firefly_iii
    depends_on:
      ollama:
        condition: service_healthy

volumes:
   firefly_iii_upload:
   firefly_iii_vendor:
   firefly_iii_public_build:
   firefly_iii_public_v1:
   firefly_iii_db:
   firefly_iii_ollama:
networks:
  firefly_iii:
    driver: bridge
