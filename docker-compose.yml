services:
  app:
    build: .
    hostname: app
    container_name: firefly_iii_core
    restart: always
    volumes:
      - .:/var/www/html
      - firefly_iii_vendor:/var/www/html/vendor
      - firefly_iii_public_build:/var/www/html/public/build
      - firefly_iii_upload:/var/www/html/storage/upload
      - ./storage/backups:/var/www/html/storage/backups
      - ./storage/budget-plans:/var/www/html/storage/budget-plans
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_CONNECTION=pgsql
    networks:
      - firefly_iii
    ports:
      # This computer only. Reach it from other devices with `tailscale serve`, not by opening the port.
      - 127.0.0.1:80:8080
    depends_on:
      - db
  db:
    image: postgres:17
    hostname: db
    container_name: firefly_iii_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    networks:
      - firefly_iii
    # Not published: only the app container talks to the database.
    # For local tools (psql / pgAdmin) temporarily add:  ports: ["127.0.0.1:5433:5432"]
    volumes:
      - firefly_iii_db:/var/lib/postgresql/data
  cron:
    #
    # To make this work, set STATIC_CRON_TOKEN in your .env file or as an environment variable
    # The STATIC_CRON_TOKEN must be *exactly* 32 characters long
    #
    image: alpine:3
    restart: always
    container_name: firefly_iii_cron
    env_file: .env
    command: sh -c "
      apk add tzdata && \
      (ln -s /usr/share/zoneinfo/$$TZ /etc/localtime || true) && \
      echo \"0 3 * * * wget -qO- http://app:8080/api/v1/cron/$$STATIC_CRON_TOKEN;echo\"
      | crontab - && \
      crond -f -L /dev/stdout"
    networks:
      - firefly_iii
    depends_on:
      - app

volumes:
   firefly_iii_upload:
   firefly_iii_vendor:
   firefly_iii_public_build:
   firefly_iii_db:
networks:
  firefly_iii:
    driver: bridge
